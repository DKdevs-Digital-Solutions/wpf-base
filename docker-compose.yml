version: "3.8"

x-common-env: &common-env
  REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  JOB_CONCURRENCY: ${JOB_CONCURRENCY:-4}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-5}
  JOB_BACKOFF_DELAY_MS: ${JOB_BACKOFF_DELAY_MS:-5000}
  BULL_BOARD_BASE_PATH: ${BULL_BOARD_BASE_PATH:-/admin/queues}
  BULLMQ_QUEUE_NAME: ${BULLMQ_QUEUE_NAME:-whatsapp-flows}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-}
  R2_REGION: ${R2_REGION:-auto}
  R2_KEY_PREFIX: ${R2_KEY_PREFIX:-flows}
  R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}

services:
  whatsapp-flows-endpoint:
    build: .
    container_name: whatsapp-flows-endpoint
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3005:3005"
    env_file:
      - .env
    environment:
      <<: *common-env
      PORT: ${PORT:-3005}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      PRIVATE_KEY_BASE64: ${PRIVATE_KEY_BASE64:-}
      ELIGIBILITY_API_URL: ${ELIGIBILITY_API_URL:-}
      EXTRA_PHASE_FAMILY_API_URL: ${EXTRA_PHASE_FAMILY_API_URL:-}
      FAMILY_CODE_VERIFICATION_API_URL: ${FAMILY_CODE_VERIFICATION_API_URL:-}
      CITY_AVAILABILITY_API_URL: ${CITY_AVAILABILITY_API_URL:-}
      EXTRA_PHASE_IBGE_API_URL: ${EXTRA_PHASE_IBGE_API_URL:-}
      CEP_API_URL: ${CEP_API_URL:-}
    volumes:
      - ./data:/app/data

  whatsapp-flows-worker:
    build: .
    container_name: whatsapp-flows-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      <<: *common-env
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      PRIVATE_KEY_BASE64: ${PRIVATE_KEY_BASE64:-}
      ELIGIBILITY_API_URL: ${ELIGIBILITY_API_URL:-}
      EXTRA_PHASE_FAMILY_API_URL: ${EXTRA_PHASE_FAMILY_API_URL:-}
      FAMILY_CODE_VERIFICATION_API_URL: ${FAMILY_CODE_VERIFICATION_API_URL:-}
      CITY_AVAILABILITY_API_URL: ${CITY_AVAILABILITY_API_URL:-}
      EXTRA_PHASE_IBGE_API_URL: ${EXTRA_PHASE_IBGE_API_URL:-}
      CEP_API_URL: ${CEP_API_URL:-}
    volumes:
      - ./data:/app/data
