services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-flows-endpoint
    restart: unless-stopped
    ports:
      - "${PORT:-3005}:3005"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3005
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      BULLMQ_QUEUE_NAME: ${BULLMQ_QUEUE_NAME:-whatsapp-flows}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-4}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-5}
      JOB_BACKOFF_TYPE: ${JOB_BACKOFF_TYPE:-exponential}
      JOB_BACKOFF_DELAY_MS: ${JOB_BACKOFF_DELAY_MS:-5000}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      PRIVATE_KEY_BASE64: ${PRIVATE_KEY_BASE64:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_KEY_PREFIX: ${R2_KEY_PREFIX:-flows}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      AUTH_URL: ${AUTH_URL}
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      AUTH_SWAP_CREDENTIALS: ${AUTH_SWAP_CREDENTIALS:-false}
      AUTH_TIMEOUT_MS: ${AUTH_TIMEOUT_MS:-15000}
      AUTH_REFRESH_BEFORE_MS: ${AUTH_REFRESH_BEFORE_MS:-300000}
      AUTH_API_KEY: ${AUTH_API_KEY:-}
      AUTH_SUBSCRIPTION_KEY: ${AUTH_SUBSCRIPTION_KEY:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_GRANT_TYPE: ${AUTH_GRANT_TYPE:-client_credentials}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-15000}
      SWAGGER_BASE_URL: ${SWAGGER_BASE_URL:-http://localhost:3005}
      CRM_BASE_URL: ${CRM_BASE_URL}
      CADASTRO_UNICO_API_URL: ${CADASTRO_UNICO_API_URL:-}
      FAMILY_CODE_VERIFICATION_API_URL: ${FAMILY_CODE_VERIFICATION_API_URL:-}
      EXTRA_PHASE_FAMILY_API_URL: ${EXTRA_PHASE_FAMILY_API_URL:-}
      CITY_AVAILABILITY_API_URL: ${CITY_AVAILABILITY_API_URL:-}
      EXTRA_PHASE_IBGE_API_URL: ${EXTRA_PHASE_IBGE_API_URL:-}
      CEP_API_URL: ${CEP_API_URL:-}
      CADUNICO_CHANNEL: ${CADUNICO_CHANNEL:-WHATSAPP}
      CADUNICO_CLASSIFICATION: ${CADUNICO_CLASSIFICATION:-AGENDAMENTO}
      CADUNICO_WHO_CONTACTED: ${CADUNICO_WHO_CONTACTED:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-flows-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      BULLMQ_QUEUE_NAME: ${BULLMQ_QUEUE_NAME:-whatsapp-flows}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-4}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-5}
      JOB_BACKOFF_TYPE: ${JOB_BACKOFF_TYPE:-exponential}
      JOB_BACKOFF_DELAY_MS: ${JOB_BACKOFF_DELAY_MS:-5000}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      PRIVATE_KEY_BASE64: ${PRIVATE_KEY_BASE64:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_KEY_PREFIX: ${R2_KEY_PREFIX:-flows}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      AUTH_URL: ${AUTH_URL}
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      AUTH_SWAP_CREDENTIALS: ${AUTH_SWAP_CREDENTIALS:-false}
      AUTH_TIMEOUT_MS: ${AUTH_TIMEOUT_MS:-15000}
      AUTH_REFRESH_BEFORE_MS: ${AUTH_REFRESH_BEFORE_MS:-300000}
      AUTH_API_KEY: ${AUTH_API_KEY:-}
      AUTH_SUBSCRIPTION_KEY: ${AUTH_SUBSCRIPTION_KEY:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_GRANT_TYPE: ${AUTH_GRANT_TYPE:-client_credentials}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-15000}
      SWAGGER_BASE_URL: ${SWAGGER_BASE_URL:-http://localhost:3005}
      CRM_BASE_URL: ${CRM_BASE_URL}
      CADASTRO_UNICO_API_URL: ${CADASTRO_UNICO_API_URL:-}
      FAMILY_CODE_VERIFICATION_API_URL: ${FAMILY_CODE_VERIFICATION_API_URL:-}
      EXTRA_PHASE_FAMILY_API_URL: ${EXTRA_PHASE_FAMILY_API_URL:-}
      CITY_AVAILABILITY_API_URL: ${CITY_AVAILABILITY_API_URL:-}
      EXTRA_PHASE_IBGE_API_URL: ${EXTRA_PHASE_IBGE_API_URL:-}
      CEP_API_URL: ${CEP_API_URL:-}
      CADUNICO_CHANNEL: ${CADUNICO_CHANNEL:-WHATSAPP}
      CADUNICO_CLASSIFICATION: ${CADUNICO_CLASSIFICATION:-AGENDAMENTO}
      CADUNICO_WHO_CONTACTED: ${CADUNICO_WHO_CONTACTED:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    container_name: whatsapp-flows-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
