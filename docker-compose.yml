version: "3.8"

x-common-env: &common-env
  # Redis ja existe no seu ambiente (na rede shared_services)
  REDIS_HOST: redis
  REDIS_PORT: 6379

  JOB_CONCURRENCY: 4
  JOB_MAX_ATTEMPTS: 5
  JOB_BACKOFF_DELAY_MS: 5000
  BULLMQ_QUEUE_NAME: proxy-jobs

  # Se o worker usa R2 pra salvar artefatos/logs
  R2_ACCOUNT_ID: "70a41e8a2dd0ed2395771e2a48c2a83a"
  R2_ACCESS_KEY_ID: "c5114fb4b0fecd5a5f9469a2fec7bda2"
  R2_SECRET_ACCESS_KEY: "3a0d894cf904dd9bf8d89c21a05a9cd2ff66b67fb8ee711612e9a80409ed084d"
  R2_BUCKET: "eaf"
  R2_REGION: "auto"
  R2_KEY_PREFIX: "jobs"
  R2_PUBLIC_BASE_URL: "https://pub-c54ecb6f6021463e95790b49774c4e8c.r2.dev"

services:
  proxy-api:
    build: .
    container_name: proxy-api
    restart: unless-stopped
    command: ["npm", "run", "start:proxy"]
    ports:
      - "3006:3006"
    networks:
      - proxy_public
      - shared_services
    environment:
      <<: *common-env
      PORT: 3006
      PROXY_PORT: 3006
      BULL_BOARD_BASE_PATH: /admin/queues

      # Protecao do proxy (mantem API key aqui)
      API_KEY: "(2>7N7G?r{?y9(Ya:h%LfAIJ%}m?KDOlKPQUEj!8Na6"

      # Auth/CRM (proxy chama essas APIs)
      AUTH_URL: "https://crm-bot-stg.sigaantenado.com.br/crm/bot/api/v1/authorization/get-token"
      AUTH_USERNAME: "jefferson.soares@abjservicos.com.br"
      AUTH_PASSWORD: "Eaf@2026"
      AUTH_SWAP_CREDENTIALS: "false"

      CRM_BASE_URL: "https://crm-bot-stg.sigaantenado.com.br/crm/bot/api/v1"
      SWAGGER_BASE_URL: "https://wfe.services.dkdevs.com.br"

      # Timeouts/parametros opcionais
      AUTH_TIMEOUT_MS: "15000"
      AUTH_REFRESH_BEFORE_MS: "300000"
      API_TIMEOUT_MS: "15000"
      CADUNICO_CHANNEL: "WHATSAPP"
      CADUNICO_CLASSIFICATION: "AGENDAMENTO"

    volumes:
      - ./data:/app/data

  proxy-worker:
    build: .
    container_name: proxy-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    networks:
      - shared_services
    environment:
      <<: *common-env
    volumes:
      - ./data:/app/data

networks:
  proxy_public:
    external: true
  shared_services:
    external: true
