version: "3.8"

services:
  whatsapp-flows-endpoint:
    build: .
    container_name: whatsapp-flows-endpoint
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nCOLE_SUA_CHAVE_AQUI\n-----END PRIVATE KEY-----"
      JOB_CONCURRENCY: 4
      JOB_POLL_INTERVAL_MS: 1500
      JOB_MAX_ATTEMPTS: 5
      R2_ACCOUNT_ID: "SEU_ACCOUNT_ID"
      R2_ACCESS_KEY_ID: "SEU_ACCESS_KEY_ID"
      R2_SECRET_ACCESS_KEY: "SEU_SECRET_ACCESS_KEY"
      R2_BUCKET: "SEU_BUCKET"
      R2_REGION: "auto"
      R2_KEY_PREFIX: "flows"
      # opcional: URL pública base para montar links no resultado
      R2_PUBLIC_BASE_URL: ""
    volumes:
      - ./data:/app/data
